<!doctype html><html><head><meta charset="utf-8"><title>Facet Gold Editor</title>
<style>
:root{color-scheme:dark}
body{background:#0e1116;color:#e6edf3;font:13px/1.4 system-ui,Segoe UI,sans-serif;margin:0;padding:16px}
h1{font-size:16px;margin:0 0 4px} .sub{color:#8b949e;margin:0 0 12px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px}
button:hover{background:#30363d} button.primary{background:#238636;border-color:#2ea043}
table{border-collapse:collapse;width:100%;font-size:12px} th,td{border:1px solid #21262d;padding:2px 4px;text-align:left;vertical-align:top}
th{background:#161b22;position:sticky;top:0;font-size:11px;color:#8b949e}
input,select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:3px 5px;font:12px system-ui;width:100%;box-sizing:border-box}
input.rationale{min-width:220px} td.surf input{font-weight:600}
tr.lowconf td{background:#1d161b} .del{color:#f85149;cursor:pointer;text-align:center;font-weight:700;user-select:none}
.cuehint{color:#6e7681;font-size:10px}
textarea{width:100%;height:140px;background:#0d1117;color:#9be3a0;border:1px solid #30363d;border-radius:6px;font:11px ui-monospace,Consolas,monospace;padding:8px;box-sizing:border-box}
.wrap{overflow:auto;max-height:62vh;border:1px solid #21262d;border-radius:6px}
.count{color:#8b949e;font-size:12px;margin-left:auto}
</style></head><body>
<h1>Facet Gold Editor</h1>
<p class="sub">Edit cells; fixed-value columns are dropdowns. Cues are comma-separated. Export gives correctly-tabbed TSV.</p>
<div class="bar">
  <button class="primary" onclick="addRow()">+ Add row</button>
  <button onclick="exportTSV()">Export TSV down</button>
  <button onclick="copyTSV()">Copy TSV</button>
  <button onclick="loadFromBox()">Load pasted TSV up</button>
  <span class="count" id="count"></span>
</div>
<div class="wrap"><table id="grid"><thead id="head"></thead><tbody id="body"></tbody></table></div>
<p class="sub" style="margin-top:14px">Paste a TSV here and click <b>Load pasted TSV</b> to re-import, or read the exported output:</p>
<textarea id="box" placeholder="exported / paste TSV here..."></textarea>
<script>
const COMMENT="# facet gold set v1 (seed, for review) \u2014 see docs/compression/spec-facet-accuracy.md \u00a73 rubric", HEADER=["surface", "kind", "bucket", "utility", "logic_cues", "abstraction", "causality", "temporality", "scope", "confidence", "rationale"], ENUMS={"kind": ["word", "phrase"], "bucket": ["TOPIC", "CONCEPT", "METHOD", "RELATION", "STRUCTURAL", "UNKNOWN"], "utility": ["CONTENT", "FUNCTION", "STRUCTURAL", "FILLER"], "abstraction": ["-", "concrete", "abstract", "metaphor"], "temporality": ["-", "temporal"], "scope": ["-", "quantified"], "confidence": ["high", "med", "low"]}, CUES=["CAUSE", "CONDITION", "INFERENCE", "EVIDENCE_CUE", "CONTRAST", "CONCESSION", "NEGATION", "QUANTIFIER", "MODAL", "QUESTION", "TEMPORAL", "COMPARISON", "DEFINITION_CUE", "CONJUNCTION", "CLAIM_CUE"];
let ROWS=[["rabbit", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete animal"], ["ocean", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete body of water"], ["money", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "med", "tangible medium of exchange; arguably abstract"], ["car", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete object"], ["table", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete object"], ["water", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete substance"], ["mountain", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete feature"], ["computer", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete device"], ["nasa", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "named org/entity"], ["dog", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "high", "concrete animal"], ["freedom", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "abstraction (heuristic mislabels TOPIC)"], ["democracy", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "abstract system (mislabeled TOPIC)"], ["love", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "emotion/abstraction (mislabeled TOPIC)"], ["justice", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "abstraction"], ["marriage", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "med", "institution/abstraction"], ["profit", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "med", "financial outcome; abstraction"], ["relationship", "word", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "abstraction"], ["god", "word", "TOPIC", "CONTENT", "-", "abstract", "-", "-", "-", "low", "entity(being) vs abstraction \u2014 labeled entity"], ["machine learning", "phrase", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "multiword domain concept"], ["climate change", "phrase", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "multiword domain concept"], ["artificial intelligence", "phrase", "CONCEPT", "CONTENT", "-", "abstract", "-", "-", "-", "high", "multiword domain concept"], ["analyze", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "high", "process verb"], ["calculate", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "high", "process verb"], ["measure", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "high", "process verb"], ["optimize", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "high", "process verb"], ["compute", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "high", "process verb"], ["write", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "med", "verb(write)/noun ambiguity; dominant verb"], ["build", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "med", "verb/noun; dominant verb"], ["running", "word", "METHOD", "CONTENT", "-", "-", "-", "-", "-", "med", "gerund; action (mislabeled TOPIC); can be noun"], ["because", "word", "RELATION", "FUNCTION", "CAUSE,EVIDENCE_CUE", "-", "CAUSE,EVIDENCE_CUE", "-", "-", "high", "causal connective"], ["but", "word", "RELATION", "FUNCTION", "CONTRAST", "-", "-", "-", "-", "high", "contrast"], ["however", "word", "RELATION", "FUNCTION", "CONTRAST", "-", "-", "-", "-", "high", "contrast"], ["if", "word", "RELATION", "FUNCTION", "CONDITION", "-", "CONDITION", "-", "-", "high", "conditional"], ["unless", "word", "RELATION", "FUNCTION", "CONDITION", "-", "CONDITION", "-", "-", "high", "conditional"], ["therefore", "word", "RELATION", "FUNCTION", "INFERENCE", "-", "INFERENCE", "-", "-", "high", "inference"], ["and", "word", "RELATION", "FUNCTION", "CONJUNCTION", "-", "-", "-", "-", "high", "conjunction"], ["when", "word", "RELATION", "FUNCTION", "CONDITION,QUESTION,TEMPORAL", "-", "CONDITION", "temporal", "-", "high", "conditional+interrogative+temporal"], ["although", "word", "RELATION", "FUNCTION", "CONCESSION,CONTRAST", "-", "-", "-", "-", "high", "concession"], ["while", "word", "RELATION", "FUNCTION", "CONCESSION,TEMPORAL", "-", "-", "temporal", "-", "med", "during + although senses"], ["due to", "phrase", "RELATION", "FUNCTION", "CAUSE", "-", "CAUSE", "-", "-", "high", "causal connective"], ["for example", "phrase", "RELATION", "FUNCTION", "EVIDENCE_CUE,INFERENCE", "-", "-", "-", "-", "high", "exemplifier (mislabeled CONCEPT)"], ["on the other hand", "phrase", "RELATION", "FUNCTION", "CONTRAST", "-", "-", "-", "-", "high", "contrast connective (mislabeled CONCEPT)"], ["so", "word", "RELATION", "FUNCTION", "INFERENCE,CAUSE", "-", "INFERENCE", "-", "-", "med", "inferential + discourse filler senses"], ["not", "word", "RELATION", "FUNCTION", "NEGATION", "-", "-", "-", "-", "high", "negation operator (heuristic mislabels TOPIC)"], ["all", "word", "RELATION", "FUNCTION", "QUANTIFIER", "-", "-", "-", "quantified", "high", "universal quantifier"], ["every", "word", "RELATION", "FUNCTION", "QUANTIFIER", "-", "-", "-", "quantified", "high", "universal quantifier"], ["some", "word", "RELATION", "FUNCTION", "QUANTIFIER", "-", "-", "-", "quantified", "med", "existential quantifier"], ["must", "word", "RELATION", "FUNCTION", "MODAL", "-", "-", "-", "-", "high", "modal (necessity)"], ["should", "word", "RELATION", "FUNCTION", "MODAL", "-", "-", "-", "-", "high", "modal (recommendation)"], ["why", "word", "RELATION", "FUNCTION", "QUESTION", "-", "-", "-", "-", "high", "interrogative"], ["what", "word", "RELATION", "FUNCTION", "QUESTION", "-", "-", "-", "-", "med", "interrogative/determiner"], ["before", "word", "RELATION", "FUNCTION", "TEMPORAL", "-", "-", "temporal", "-", "high", "temporal connective"], ["after", "word", "RELATION", "FUNCTION", "TEMPORAL", "-", "-", "temporal", "-", "high", "temporal connective"], ["than", "word", "RELATION", "FUNCTION", "COMPARISON", "-", "-", "-", "-", "high", "comparison"], ["or", "word", "RELATION", "FUNCTION", "CONJUNCTION", "-", "-", "-", "-", "high", "disjunction"], ["nor", "word", "RELATION", "FUNCTION", "CONJUNCTION,NEGATION", "-", "-", "-", "-", "med", "negated disjunction"], ["?", "word", "STRUCTURAL", "STRUCTURAL", "QUESTION", "-", "-", "-", "-", "high", "question mark"], [".", "word", "STRUCTURAL", "STRUCTURAL", "-", "-", "-", "-", "-", "high", "sentence boundary"], [",", "word", "STRUCTURAL", "STRUCTURAL", "-", "-", "-", "-", "-", "high", "comma"], [";", "word", "STRUCTURAL", "STRUCTURAL", "-", "-", "-", "-", "-", "high", "semicolon"], [":", "word", "STRUCTURAL", "STRUCTURAL", "-", "-", "-", "-", "-", "high", "colon"], ["um", "word", "UNKNOWN", "FILLER", "-", "-", "-", "-", "-", "high", "cognitive filler"], ["uh", "word", "UNKNOWN", "FILLER", "-", "-", "-", "-", "-", "high", "cognitive filler"], ["basically", "word", "UNKNOWN", "FILLER", "-", "-", "-", "-", "-", "med", "hedge/discourse filler"], ["like", "word", "RELATION", "FILLER", "-", "-", "-", "-", "-", "low", "discourse filler AND comparison marker"], ["you know", "phrase", "UNKNOWN", "FILLER", "-", "-", "-", "-", "-", "high", "validation-seeking filler"], ["i mean", "phrase", "UNKNOWN", "FILLER", "-", "-", "-", "-", "-", "high", "repair/discourse filler"], ["bank", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "low", "river bank vs institution \u2014 sense-ambiguous"], ["light", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "low", "noun/adj/verb; dominant noun"], ["fire", "word", "TOPIC", "CONTENT", "-", "concrete", "-", "-", "-", "low", "noun/verb; dominant noun"], ["state", "word", "TOPIC", "CONTENT", "-", "abstract", "-", "-", "-", "low", "noun(condition/govt)/verb; abstract-leaning"]];
const CUECOLS=["logic_cues","causality"];
function el(t,a){a=a||{};const e=document.createElement(t);for(const k in a)e[k]=a[k];return e;}
function render(){
  const head=document.getElementById('head'); head.innerHTML='';
  const htr=el('tr'); htr.appendChild(el('th',{textContent:''}));
  HEADER.forEach(function(h){htr.appendChild(el('th',{textContent:h}));}); head.appendChild(htr);
  const body=document.getElementById('body'); body.innerHTML='';
  ROWS.forEach(function(row,ri){
    const tr=el('tr'); if(row[HEADER.indexOf('confidence')]==='low')tr.className='lowconf';
    const del=el('td',{className:'del',textContent:'x',title:'delete'}); del.onclick=function(){ROWS.splice(ri,1);render();}; tr.appendChild(del);
    HEADER.forEach(function(col,ci){
      const td=el('td'); if(col==='surface')td.className='surf';
      if(ENUMS[col]){
        const s=el('select'); ENUMS[col].forEach(function(o){const op=el('option',{value:o,textContent:o});if(row[ci]===o)op.selected=true;s.appendChild(op);});
        if(ENUMS[col].indexOf(row[ci])<0){const op=el('option',{value:row[ci],textContent:row[ci]+' (?)'});op.selected=true;s.appendChild(op);}
        s.onchange=function(e){ROWS[ri][ci]=e.target.value; if(col==='confidence')render();}; td.appendChild(s);
      } else {
        const inp=el('input',{value:row[ci]||''}); if(col==='rationale')inp.className='rationale';
        if(CUECOLS.indexOf(col)>=0)inp.title='comma-separated cues: '+CUES.join(', ');
        inp.oninput=function(e){ROWS[ri][ci]=e.target.value;}; td.appendChild(inp);
        if(CUECOLS.indexOf(col)>=0)td.appendChild(el('div',{className:'cuehint',textContent:'cues'}));
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  document.getElementById('count').textContent=ROWS.length+' rows';
}
function addRow(){const r=HEADER.map(function(h){return ENUMS[h]?ENUMS[h][0]:(h==='confidence'?'med':'-');});r[0]='';r[1]='word';ROWS.push(r);render();window.scrollTo(0,1e9);}
function toTSV(){let out=COMMENT?COMMENT+'\n':''; out+=HEADER.join('\t')+'\n'; out+=ROWS.map(function(r){return HEADER.map(function(_,i){return (r[i]==null?'':r[i]).toString().replace(/\t/g,' ');}).join('\t');}).join('\n'); return out+'\n';}
function exportTSV(){const tsv=toTSV(); document.getElementById('box').value=tsv; const b=new Blob([tsv],{type:'text/tab-separated-values'}); const a=el('a',{href:URL.createObjectURL(b),download:'facet_gold.tsv'}); document.body.appendChild(a); a.click(); a.remove();}
function copyTSV(){const tsv=toTSV(); document.getElementById('box').value=tsv; if(navigator.clipboard)navigator.clipboard.writeText(tsv);}
function loadFromBox(){const t=document.getElementById('box').value.split(/\r?\n/).filter(function(x){return x.length;}); let i=0; if(t[0]&&t[0].charAt(0)==='#')i=1; ROWS=t.slice(i+1).filter(function(x){return x.trim();}).map(function(l){const c=l.split('\t'); return HEADER.map(function(_,j){return c[j]==null?'':c[j];});}); render();}
render();
</script></body></html>
